# AI Runtime OS — Phase 1 基础设施
# 启动：docker compose up -d
# 停止：docker compose down

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-os-postgres
    environment:
      POSTGRES_DB: ai_runtime_os
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aios_dev_2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ai_runtime_os"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai-os-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
