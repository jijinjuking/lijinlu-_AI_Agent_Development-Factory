# AI Runtime OS — Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ai-runtime-os
  labels:
    app: ai-runtime-os
    component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ai-runtime-os
      component: frontend
  template:
    metadata:
      labels:
        app: ai-runtime-os
        component: frontend
    spec:
      containers:
      - name: frontend
        image: ai-runtime-os/frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ai-runtime-os
  labels:
    app: ai-runtime-os
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: ai-runtime-os
    component: frontend
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
