# AI Runtime OS — kustomization.yaml (kubectl apply -k ./k8s/)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-runtime-os

resources:
  - 00-namespace.yaml
  - 01-secrets.yaml
  - 02-backend-api.yaml
  - 03-backend-worker.yaml
  - 04-frontend.yaml
  - 05-ingress.yaml

commonLabels:
  app.kubernetes.io/name: ai-runtime-os
  app.kubernetes.io/part-of: ai-runtime-os
  app.kubernetes.io/managed-by: kustomize

images:
  - name: ai-runtime-os/backend
    newTag: latest
  - name: ai-runtime-os/frontend
    newTag: latest
