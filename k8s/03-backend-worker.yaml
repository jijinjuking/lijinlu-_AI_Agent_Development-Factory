# AI Runtime OS — LangGraph Worker Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-worker
  namespace: ai-runtime-os
  labels:
    app: ai-runtime-os
    component: worker
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ai-runtime-os
      component: worker
  template:
    metadata:
      labels:
        app: ai-runtime-os
        component: worker
    spec:
      serviceAccountName: ai-runtime-worker
      terminationGracePeriodSeconds: 120
      containers:
      - name: worker
        image: ai-runtime-os/backend:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "app.workers.langgraph_worker"]
        ports:
        - containerPort: 8001
          name: health
          protocol: TCP
        env:
        - name: WORKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ai-runtime-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: ai-runtime-secrets
              key: redis-url
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: ai-runtime-secrets
              key: minio-access-key
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ai-runtime-secrets
              key: minio-secret-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-runtime-secrets
              key: openai-api-key
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: ai-runtime-os
                  component: worker
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-runtime-worker
  namespace: ai-runtime-os
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-worker-pdb
  namespace: ai-runtime-os
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ai-runtime-os
      component: worker
